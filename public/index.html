<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquila DocForge</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

  <!-- Site header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">Aquila DocForge</h1>
      <p class="site-subtitle">Convert Markdown into clean preview and PDF</p>
    </div>
  </header>

  <!-- Main application area -->
  <main class="app-main">

    <!-- Toolbar: editor actions -->
    <nav class="toolbar" aria-label="Editor actions">
      <button type="button" id="btnNew" class="toolbar-btn">New</button>
      <button type="button" id="btnLoadSample" class="toolbar-btn">Load Sample</button>
      <button type="button" id="btnCopyHtml" class="toolbar-btn">Copy HTML</button>
      <button type="button" id="btnPrint" class="toolbar-btn">Print / Save PDF</button>
      <button type="button" id="btnExportPdf" class="toolbar-btn toolbar-btn--primary">Export PDF</button>
    </nav>

    <!-- Two-column editor: Markdown input (left) and preview (right) -->
    <div class="editor-layout">

      <section class="panel panel--input" aria-label="Markdown input">
        <h2 class="panel-title">Markdown Input</h2>
        <textarea
          id="markdownInput"
          class="markdown-textarea"
          placeholder="Type or paste your Markdown here..."
          spellcheck="false"
        ></textarea>
      </section>

      <section class="panel panel--preview" aria-label="Document preview">
        <h2 class="panel-title">Normal Preview</h2>
        <div id="previewOutput" class="preview-output">
          <p class="preview-placeholder">Start typing Markdown to see a live preview.</p>
        </div>
      </section>

    </div>
  </main>

  <!-- Site footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span>Phase 2 MVP</span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span>Local-first editor</span>
    </div>
  </footer>

  <!-- Markdown parser library: markdown-it -->
  <!-- Offline use: copy markdown-it.min.js to public/assets/vendor/ and update src below -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <!-- GFM table support (needed for pipe-style tables in the sample). Offline: public/assets/vendor/ -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-multimd-table@4.2.3/dist/markdown-it-multimd-table.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
